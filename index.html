<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concierto virtual</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>body{margin:0;font-family:Arial}#help{position:fixed;z-index:5;top:16px;left:16px;background:#10121ddd;color:white;padding:14px;border-radius:12px;font-size:13px;line-height:1.6;pointer-events:none}body.vr #help{display:none}</style>
<script>
let audio,active='Piano',palette=0;const colors=['#9875ff','#4bbcff','#ff5599','#fff1dc'];
function sound(){audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();return audio;}
function note(name,n=0){let c=sound(),t=c.currentTime;function tone(f,type,vol,dur,end=f){let o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(end,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(t+dur)}function noise(dur,hz,vol){let b=c.createBuffer(1,Math.ceil(c.sampleRate*dur),c.sampleRate),v=b.getChannelData(0);for(let i=0;i<v.length;i++)v[i]=Math.random()*2-1;let o=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();o.buffer=b;f.type='highpass';f.frequency.value=hz;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f);f.connect(g);g.connect(c.destination);o.start()}
if(name==='Batería'){if(n===0)tone(145,'sine',.3,.3,42);else if(n===4){noise(.19,1000,.19);tone(180,'triangle',.09,.12,95)}else if(n>=5)noise(n===5?.09:n===6?.45:.8,n===5?6500:3500,.13);else tone([0,210,155,105][n],'sine',.22,.3,65);return;}
let f=name==='Guitarra'?[82.41,110,146.83,196,246.94,329.63][n%6]:name==='Bajo'?[41.2,55,73.42,98][n%4]:440*2**((n-69)/12);if(name==='DJ')f=110*2**(n/12);tone(f,name==='Piano'?'sine':name==='Sintetizador'?'sawtooth':'triangle',.12,.65);if(name==='Piano'||name==='Guitarra')tone(f*2,'sine',.045,.25);}
AFRAME.registerComponent('playable',{schema:{name:{type:'string'},n:{default:60}},init(){this.el.classList.add('hit');this.el.addEventListener('click',()=>{let t=performance.now();if(t-(this.last||-1000)<100)return;this.last=t;active=this.data.name;note(active,this.data.n);document.querySelector('#status').textContent=active;let e=this.el,old=e.getAttribute('material').emissive;e.setAttribute('material','emissive','#557799');setTimeout(()=>e.setAttribute('material','emissive',old||'#000'),120);});}});
let micStream,micNodes=[],micBusy=false;async function toggleMic(){if(micBusy)return;if(micStream){micStream.getTracks().forEach(t=>t.stop());micNodes.forEach(n=>n.disconnect());micStream=null;document.querySelector('#miclabel').setAttribute('value','MIC: OFF');return;}micBusy=true;try{let c=sound();micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});let src=c.createMediaStreamSource(micStream),delay=c.createDelay(1),wet=c.createGain(),feedback=c.createGain(),rev=c.createConvolver(),rg=c.createGain();delay.delayTime.value=.28;wet.gain.value=.22;feedback.gain.value=.22;rg.gain.value=.12;let b=c.createBuffer(2,c.sampleRate*1.3,c.sampleRate);for(let j=0;j<2;j++){let a=b.getChannelData(j);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length)**3;}rev.buffer=b;src.connect(delay);delay.connect(feedback);feedback.connect(delay);delay.connect(wet);wet.connect(c.destination);src.connect(rev);rev.connect(rg);rg.connect(c.destination);micNodes=[src,delay,wet,feedback,rev,rg];document.querySelector('#miclabel').setAttribute('value','MIC: ON');}catch(e){document.querySelector('#miclabel').setAttribute('value','MIC: permiso requerido');}finally{micBusy=false;}}
AFRAME.registerComponent('mic-toggle',{init(){this.el.classList.add('hit');this.el.addEventListener('click',toggleMic);}});
AFRAME.registerComponent('finger-play',{init(){this.prev=new Map();this.box=new AFRAME.THREE.Box3();this.p=new AFRAME.THREE.Vector3();},tick(){let scene=this.el.sceneEl,frame=scene.frame,session=scene.renderer.xr.getSession(),space=scene.renderer.xr.getReferenceSpace();if(!frame||!session||!space)return;let rig=document.querySelector('#rig').object3D;for(let source of session.inputSources){if(!source.hand)continue;for(let finger of ['index','middle','ring','pinky','thumb']){let joint=source.hand.get(finger+'-finger-tip')||source.hand.get(finger+'-tip');if(!joint)continue;let pose=frame.getJointPose(joint,space);if(!pose)continue;let v=pose.transform.position;this.p.set(v.x,v.y,v.z);rig.localToWorld(this.p);let best=null,dist=.018;for(let e of document.querySelectorAll('[playable], [mic-toggle], [dj-button]')){let mesh=e.getObject3D('mesh');if(!mesh)continue;this.box.setFromObject(mesh);let d=this.box.distanceToPoint(this.p);if(d<dist){dist=d;best=e;}}let key=source.handedness+finger;if(best&&this.prev.get(key)!==best)best.emit('click');this.prev.set(key,best);}}}});
AFRAME.registerComponent('action',{schema:{type:'string'},init(){this.el.classList.add('hit');this.el.addEventListener('click',()=>{if(this.data==='lights'){palette++;document.querySelectorAll('.showlight').forEach((e,i)=>e.setAttribute('light','color',colors[(i+palette)%4]));document.querySelectorAll('.beam').forEach((e,i)=>e.setAttribute('material','color',colors[(i+palette)%4]));}else if(this.data==='screen'){document.querySelector('#screen').setAttribute('material','color',colors[++palette%4]);}else{let e=document.querySelector('#mist');e.setAttribute('visible',!e.getAttribute('visible'));}})}});
AFRAME.registerComponent('walk',{
 init(){this.keys={};this.v=0;this.jump=false;this.turned=false;window.addEventListener('keydown',e=>{this.keys[e.code]=true;if(e.code==='Space'&&!e.repeat)this.jump=true});window.addEventListener('keyup',e=>this.keys[e.code]=false);},
 tick(t,dt){const scene=this.el.sceneEl,p=this.el.object3D.position,cam=document.querySelector('#cam');if(!cam)return;const d=Math.min(dt||0,50)/1000;let x=0,z=0,turn=0;const session=scene.renderer?.xr?.getSession();if(session){for(const source of session.inputSources){const g=source.gamepad;if(!g)continue;const a=g.axes;let ax=a.length>=4?a[2]:a[0]||0,ay=a.length>=4?a[3]:a[1]||0;if(source.handedness==='left'){x=ax;z=ay}if(source.handedness==='right'){turn=ax;let pressed=!!g.buttons[4]?.pressed;if(pressed&&!this.aPressed)this.jump=true;this.aPressed=pressed;}}}else{ x=(this.keys.KeyD?1:0)-(this.keys.KeyA?1:0);z=(this.keys.KeyS?1:0)-(this.keys.KeyW?1:0);}
 if(Math.abs(turn)>.7&&!this.turned){this.el.object3D.rotation.y-=Math.sign(turn)*Math.PI/6;this.turned=true}if(Math.abs(turn)<.3)this.turned=false;
 if(Math.abs(x)<.15)x=0;if(Math.abs(z)<.15)z=0;let len=Math.max(1,Math.hypot(x,z));const q=new AFRAME.THREE.Quaternion();cam.object3D.getWorldQuaternion(q);const f=new AFRAME.THREE.Vector3(0,0,-1).applyQuaternion(q);let yaw=Math.atan2(-f.x,-f.z);p.x+=(x*Math.cos(yaw)+z*Math.sin(yaw))*3*d/len;p.z+=(-x*Math.sin(yaw)+z*Math.cos(yaw))*3*d/len;let r=Math.hypot(p.x,p.z);if(r>43){p.x*=43/r;p.z*=43/r;}
 const ground=(Math.abs(p.x)<=18&&p.z>=-27&&p.z<=-9)||(Math.abs(p.x)<=3&&p.z>=-9&&p.z<=13)||Math.hypot(p.x,p.z-14)<=5?1.2:0; if(this.jump&&p.y<=ground+.08){this.v=4.8;}this.jump=false;this.v-=9.8*d;p.y+=this.v*d;if(p.y<=ground){p.y=ground;this.v=0;}
 }
});
AFRAME.registerComponent('touch-play',{
 init(){this.last=null;this.next=0;this.tip=new AFRAME.THREE.Vector3();this.bounds=new AFRAME.THREE.Box3();},
 tick(t){if(!this.el.sceneEl.is('vr-mode')||t<this.next)return;this.next=t+45;const session=this.el.sceneEl.renderer?.xr?.getSession();const hand=this.el.id==='left'?'left':'right';if(!session||!Array.from(session.inputSources).some(s=>s.handedness===hand&&s.gamepad))return;this.tip.set(0,0,-.10);this.el.object3D.localToWorld(this.tip);let best=null,dist=.075;for(const e of document.querySelectorAll('[playable], [dj-button]')){const mesh=e.getObject3D('mesh');if(!mesh)continue;this.bounds.setFromObject(mesh);const v=this.bounds.distanceToPoint(this.tip);if(v<dist){dist=v;best=e;}}if(best&&best!==this.last){best.emit('click');}this.last=best;}
});

let beatTimer=null, bassOn=false, beatStep=0, fx=false;
AFRAME.registerComponent('dj-button',{schema:{type:'string'},init(){this.el.classList.add('hit');this.el.addEventListener('click',()=>{sound();let v=this.data;if(v==='STOP'){clearInterval(beatTimer);beatTimer=null;bassOn=false;}if(v==='BASS')bassOn=!bassOn;if(v==='FX'){fx=!fx;note('DJ',fx?12:3);}if(v==='BEAT'&&!beatTimer){beatStep=0;beatTimer=setInterval(()=>{let i=beatStep++;if(i%4===0)note('Batería',0);if(i%8===4)note('Batería',4);if(i%2===0)note('Batería',5);if(bassOn&&i%4===0)note('Bajo',[0,0,2,1][Math.floor(i/4)%4]);if(fx&&i%8===6)note('DJ',7);},125);}this.el.setAttribute('material','emissive','#555555');setTimeout(()=>this.el.setAttribute('material','emissive','#000'),180);});}});
AFRAME.registerComponent('scratch',{init(){this.el.addEventListener('click',()=>{let c=sound(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(55,t+.16);g.gain.setValueAtTime(.055,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(t+.2);});}});
AFRAME.registerComponent('carry',{init(){this.home=this.el.object3D.position.clone();this.held=null;this.cool=0;},tick(t){let sc=this.el.sceneEl,session=sc.renderer?.xr?.getSession(),frame=sc.frame,space=sc.renderer?.xr?.getReferenceSpace();if(!session||!frame||!space)return;let T=AFRAME.THREE,rig=document.querySelector('#rig').object3D,obj=this.el.object3D;for(let src of session.inputSources){let pose,pressed=false;if(src.hand){let a=src.hand.get('thumb-tip'),b=src.hand.get('index-finger-tip');if(!a||!b)continue;let pa=frame.getJointPose(a,space),pb=frame.getJointPose(b,space);if(!pa||!pb)continue;let u=pa.transform.position,v=pb.transform.position;pressed=Math.hypot(u.x-v.x,u.y-v.y,u.z-v.z)<.028;pose=pb;}else if(src.gamepad&&src.gripSpace){pose=frame.getPose(src.gripSpace,space);pressed=!!src.gamepad.buttons[1]?.pressed;}if(!pose)continue;let v=pose.transform.position,point=rig.localToWorld(new T.Vector3(v.x,v.y,v.z));if(this.held===src){if(!pressed){this.held=null;this.cool=t+350;obj.position.copy(this.home);obj.rotation.set(0,0,0);}else{obj.position.copy(obj.parent.worldToLocal(point.clone()));obj.position.y-=.55;obj.rotation.z=-.65;}return;}if(!this.held&&pressed&&t>this.cool&&!Array.from(document.querySelectorAll('[carry]')).some(e=>e!==this.el&&e.components.carry?.held===src)){let h=this.el.querySelector('[grab-handle]');let center=h.object3D.getWorldPosition(new T.Vector3());if(center.distanceTo(point)<.22){this.held=src;return;}}}}});
</script></head><body><div id="help"><b>CONCIERTO VIRTUAL</b><br>WASD · caminar | espacio · saltar | mouse · mirar<br>Clic · tocar | 1–8 · notas | DJ: BEAT / BASS / STOP / FX<br>Quest: joysticks · A saltar · tocar con mandos<br><span id="status">Explora el escenario</span></div>

</a-scene><script>
const scene=document.querySelector('a-scene'),world=document.querySelector('#world');
function el(tag,attrs={},parent=world){let e=document.createElement(tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}
function box(x,y,z,w,h,d,c,p=world,extra={}){return el('a-box',{position:`${x} ${y} ${z}`,width:w,height:h,depth:d,color:c,...extra},p)}
function cyl(x,y,z,r,h,c,p=world,extra={}){return el('a-cylinder',{position:`${x} ${y} ${z}`,radius:r,height:h,color:c,'segments-radial':24,...extra},p)}
function group(x,y,z){return el('a-entity',{position:`${x} ${y} ${z}`})}
function label(p,name,x,y,z,w=4){el('a-text',{value:name,align:'center',color:'#fff',width:w,position:`${x} ${y} ${z}`},p)}
function hit(e,name,n=0){e.setAttribute('playable',{name,n});return e}
const dark='#171922',steel='#77808e',gold='#c5a45d',white='#f4f1e9';
box(0,-.16,0,145,.3,145,'#20372e');for(let i=-40;i<40;i+=8)box(i,-.005,0,4,.01,85,'#263e32');
// Graderías escalonadas, sectores y accesos.
for(let tier=0;tier<2;tier++)for(let row=0;row<7;row++){let r=46+tier*13+row*1.65,y=.7+tier*8+row*.8;el('a-ring',{radiusInner:r-.83,radiusOuter:r+.83,rotation:'-90 0 0',position:`0 ${y} 0`,color:'#535866','segments-theta':96});for(let s=0;s<48;s++){if(s%12===0)continue;let a=s*Math.PI/24;let e=box(Math.cos(a)*r,y+.25,Math.sin(a)*r,3.6,.48,.72,tier?'#343f63':'#294d76');e.setAttribute('rotation',`0 ${90-a*180/Math.PI} 0`);}}
for(let s=0;s<32;s++){let a=s*Math.PI/16;box(Math.cos(a)*70,8,Math.sin(a)*70,.6,16,.6,steel);let e=box(Math.cos(a)*65,16,Math.sin(a)*65,13,.45,4,dark);e.setAttribute('rotation',`0 ${-a*180/Math.PI} 0`)}
// Escenario y pasarela.
box(0,.6,-18,36,1.2,18,dark);box(0,.6,2,6,1.2,22,dark);cyl(0,.6,14,5,1.2,dark);for(let x of [-3,3])box(x,1.23,2,.09,.06,22,'#ae8cff',world,{material:'shader:flat'});box(0,1.23,-9,36,.05,.09,'#ae8cff',world,{material:'shader:flat'});
for(let i=0;i<6;i++)box(16,.1*(i+1),-5-i*.65,3,.2*(i+1),.65,dark);
for(let x of [-18,18])for(let z of [-27,-9]){box(x,8,z,.5,16,.5,steel);for(let i=1;i<16;i++){let b=box(x,i,z,.1,1.3,.12,steel);b.setAttribute('rotation',`0 0 ${i%2?35:-35}`)}}for(let z of [-27,-9])box(0,16,z,36,.5,.5,steel);for(let x of [-18,18])box(x,16,-18,.5,.5,18,steel);
box(0,8,-26.8,28,12,.5,'#090a10');box(0,8,-26.48,27.5,11.5,.1,'#5145a5',world,{id:'screen',material:'shader:flat'});for(let i=0;i<36;i++){let b=box(-13+i*.74,8,-26.35,.42,3,.08,colors[i%4],world,{material:'shader:flat'});b.setAttribute('animation',`property:scale.y;from:.2;to:${1+Math.sin(i)*.7};dur:${650+i%7*110};dir:alternate;loop:true;easing:easeInOutSine`)}
for(let x of [-20,20]){box(x,7,-24,5,9,.4,'#28243f');for(let i=0;i<7;i++){box(x,3+i,-13,1.8,.9,1.2,'#08090b');cyl(x,3+i,-12.35,.32,.08,'#333844',world,{rotation:'90 0 0'})}}
// Piano.
let p=group(-10,1.2,-18);p.setAttribute('scale','0.58 0.55 0.58');box(0,1.15,-.6,2.8,.35,2.6,'#08090c',p);cyl(0,1.15,-1.65,1.4,.35,'#08090c',p);box(0,1.65,-.8,2.8,.12,2.7,'#14151a',p,{rotation:'0 0 18'});for(let x of [-1.1,1.1])box(x,.55,.45,.13,1.1,.13,dark,p);box(0,.55,-2,.13,1.1,.13,dark,p);for(let i=0;i<24;i++){hit(box(-1.32+i*.113,1.37,.82,.108,.08,.55,white,p),'Piano',48+12*Math.floor(i/7)+[0,2,4,5,7,9,11][i%7]);if(![2,6].includes(i%7))hit(box(-1.27+i*.113,1.44,.68,.065,.09,.3,'#08090b',p),'Piano',49+12*Math.floor(i/7)+[0,2,4,5,7,9,11][i%7])}box(0,.55,1.8,1.2,.18,.6,dark,p);for(let x of [-.45,.45])box(x,.25,1.8,.12,.5,.4,steel,p);label(p,'PIANO',0,2.8,1);
// Batería.
let d=group(0,1.2,-21);d.setAttribute('scale','0.55 0.55 0.55');box(0,.15,0,5,.3,4,dark,d);function drum(x,y,z,r,h,rot,n){let g=el('a-entity',{position:`${x} ${y} ${z}`,rotation:rot},d);hit(cyl(0,0,0,r,h,'#8d2945',g),'Batería',n);hit(cyl(0,h/2+.02,0,r+.025,.05,white,g),'Batería',n);cyl(0,-h/2,0,r+.025,.05,steel,g)}drum(0,1,1,.75,.7,'90 0 0',0);drum(-.6,1.85,.6,.4,.45,'0 0 0',1);drum(.6,1.85,.6,.4,.45,'0 0 0',2);drum(1.5,1,0,.55,.7,'0 0 0',3);drum(-1.4,1.2,.5,.42,.25,'0 0 0',4);for(let x of [-2,2])for(let z of [-.6,1.3]){cyl(x,1.25,z,.035,2,steel,d);hit(cyl(x,2.3,z,.65,.055,gold,d),'Batería',x<0?(z<0?5:6):7)}label(d,'BATERÍA',0,3.2,1);
// Guitarra y bajo.
function guitar(name,x,z,c){let g=group(x,1.2,z);g.setAttribute('scale','0.65 0.55 0.65');el('a-sphere',{position:'0 .8 0',scale:'.55 .72 .14',color:c},g);el('a-sphere',{position:'0 1.3 0',scale:'.43 .43 .14',color:c},g);box(0,1.95,0,.24,1.45,.12,'#69472f',g);box(0,2.78,0,.32,.36,.13,c,g);let count=name==='Bajo'?4:6;for(let i=0;i<count;i++)hit(box((i-(count-1)/2)*.065,1.68,.17,.018,2.05,.035,steel,g),name,i);for(let i=0;i<13;i++)box(0,1.35+i*.09,.075,.24,.013,.02,steel,g);label(g,name,0,3.3,.3);g.setAttribute('carry','');box(0,.9,.24,.24,.25,.08,'#222333',g,{'grab-handle':''})}guitar('Guitarra',7,-19,'#b52b39');guitar('Bajo',12,-20,'#ba8a51');
let k=group(-11,1.2,-12);k.setAttribute('scale','0.65 0.63 0.65');box(0,1.05,0,3,.2,.85,dark,k);for(let i=0;i<24;i++)hit(box(-1.38+i*.118,1.19,.15,.11,.06,.5,white,k),'Sintetizador',48+12*Math.floor(i/7)+[0,2,4,5,7,9,11][i%7]);for(let i=0;i<24;i++)if(![2,6].includes(i%7))hit(box(-1.32+i*.118,1.24,.02,.065,.07,.28,dark,k),'Sintetizador',49+12*Math.floor(i/7)+[0,2,4,5,7,9,11][i%7]);for(let a of [-30,30])box(0,.52,0,.12,1.2,.15,steel,k,{rotation:`0 0 ${a}`});label(k,'SINTETIZADOR',0,2,.5);
let dj=group(10,1.2,-12);box(0,.55,0,3.2,1.1,1.2,dark,dj);for(let x of [-1,1]){let disc=hit(cyl(x,1.17,0,.47,.1,steel,dj),'DJ');disc.setAttribute('scratch','');box(x,1.23,.22,.035,.02,.35,'#ff77aa',dj);}for(let i=0;i<8;i++)hit(box(-.3+i%4*.2,1.16,-.2+Math.floor(i/4)*.3,.12,.08,.12,colors[i%4],dj),'DJ',i);label(dj,'DJ',0,2,.5);['BEAT','BASS','STOP','FX'].forEach((v,i)=>{let b=box(-.6+i*.4,1.18,.46,.32,.09,.18,colors[i],dj,{'dj-button':v});el('a-text',{value:v,align:'center',width:1.3,rotation:'-90 0 0',position:`${-.6+i*.4} 1.24 .46`},dj)});dj.setAttribute('scale','0.85 0.75 0.85');
cyl(0,1.25,-10,.35,.1,dark);cyl(0,1.9,-10,.035,1.4,steel);cyl(0,2.6,-10,.09,.3,dark,world,{rotation:'0 0 65','mic-toggle':''});el('a-text',{id:'miclabel',value:'MIC: OFF',position:'0 2.85 -10',align:'center',width:2});
// Focos y haces visuales.
for(let i=0;i<8;i++){let x=-15+i*4.3;box(x,15.4,-10,.7,.6,.7,dark);el('a-entity',{class:'showlight',position:`${x} 15 -10`,light:`type:spot; color:${colors[i%4]}; intensity:2.5; angle:27; penumbra:.6; distance:38; target:#target${i}`});el('a-entity',{id:`target${i}`,position:`${x*.6} 1 -18`});el('a-cone',{class:'beam',position:`${x} 8 -13`,rotation:'20 0 0',height:14,'radius-bottom':2.5,'radius-top':.03,material:`shader:flat; color:${colors[i%4]}; transparent:true; opacity:.045; depthWrite:false; side:double`})}
let mist=el('a-entity',{id:'mist',visible:false});for(let i=0;i<12;i++)el('a-sphere',{position:`${-14+i*2.5} 1.6 -14`,scale:'3 .25 1.6',material:'shader:flat; color:#a9b3ce; transparent:true; opacity:.06; depthWrite:false'},mist);
// Panel físico accesible con los mandos VR.
let panel=group(-5,1.2,-10);box(0,1.3,0,2.7,1.5,.15,dark,panel);label(panel,'CONTROL',0,1.86,.1,3);['lights','screen','fog'].forEach((a,i)=>{let y=1.5-i*.36;box(0,y,.12,2.35,.28,.12,'#43456c',panel,{action:a});label(panel,['LUCES','PANTALLA','HUMO'][i],0,y,.2,2.5)});
window.addEventListener('keydown',e=>{let n=Number(e.key);if(n>=1&&n<=8&&!e.repeat)note(active,active==='Piano'||active==='Sintetizador'?59+n:n-1)});scene.addEventListener('enter-vr',()=>document.body.classList.add('vr'));scene.addEventListener('exit-vr',()=>document.body.classList.remove('vr'));
</script></body></html>
