<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concierto virtual</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>body{margin:0;font-family:Arial}#help{position:fixed;z-index:5;top:16px;left:16px;background:#10121ddd;color:white;padding:14px;border-radius:12px;font-size:13px;line-height:1.6;pointer-events:none}body.vr #help{display:none}</style>
<script>
let audio,active='Piano',palette=0;const colors=['#9875ff','#4bbcff','#ff5599','#fff1dc'];
function note(name,n=0){audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();let t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();let f=[261.63,293.66,329.63,349.23,392,440,493.88,523.25][n%8];o.type=({Piano:'sine',Guitarra:'triangle',Bajo:'triangle',Sintetizador:'sawtooth',DJ:'square'})[name]||'sine';o.frequency.value=name==='Bajo'?f/2:f;if(name==='Batería'){o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(38,t+.2)}g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g);g.connect(audio.destination);o.start();o.stop(t+.65)}
AFRAME.registerComponent('playable',{schema:{name:{type:'string'},n:{default:0}},init(){this.el.classList.add('hit');this.el.addEventListener('click',()=>{active=this.data.name;note(active,this.data.n);document.querySelector('#status').textContent=active;});}});
AFRAME.registerComponent('action',{schema:{type:'string'},init(){this.el.classList.add('hit');this.el.addEventListener('click',()=>{if(this.data==='lights'){palette++;document.querySelectorAll('.showlight').forEach((e,i)=>e.setAttribute('light','color',colors[(i+palette)%4]));document.querySelectorAll('.beam').forEach((e,i)=>e.setAttribute('material','color',colors[(i+palette)%4]));}else if(this.data==='screen'){document.querySelector('#screen').setAttribute('material','color',colors[++palette%4]);}else{let e=document.querySelector('#mist');e.setAttribute('visible',!e.getAttribute('visible'));}})}});
AFRAME.registerComponent('walk',{init(){this.axes=[0,0];this.turn=0;this.keys={};window.addEventListener('keydown',e=>this.keys[e.key.toLowerCase()]=true);window.addEventListener('keyup',e=>this.keys[e.key.toLowerCase()]=false);let l=document.querySelector('#left'),r=document.querySelector('#right');l.addEventListener('thumbstickmoved',e=>this.axes=[e.detail.x,e.detail.y]);r.addEventListener('thumbstickmoved',e=>this.turn=e.detail.x);},tick(t,dt){let p=this.el.object3D.position,cam=document.querySelector('#cam').object3D;let yaw=this.el.object3D.rotation.y+cam.rotation.y;let x=this.axes[0]+(this.keys.d?1:0)-(this.keys.a?1:0),z=this.axes[1]+(this.keys.s?1:0)-(this.keys.w?1:0);let s=Math.min(dt||0,50)/1000*4;p.x+=(x*Math.cos(yaw)+z*Math.sin(yaw))*s;p.z+=(-x*Math.sin(yaw)+z*Math.cos(yaw))*s;if(Math.hypot(p.x,p.z)>43){let k=43/Math.hypot(p.x,p.z);p.x*=k;p.z*=k}if(Math.abs(this.turn)>.7&&!this.turned){this.el.object3D.rotation.y-=Math.sign(this.turn)*Math.PI/6;this.turned=true}if(Math.abs(this.turn)<.3)this.turned=false;let stage=Math.abs(p.x)<18&&p.z>-27&&p.z<-9,run=Math.abs(p.x)<3&&p.z>=-9&&p.z<13;p.y+=( (stage||run?1.2:0)-p.y)*Math.min(s*2,1);}});
</script></head><body><div id="help"><b>CONCIERTO VIRTUAL</b><br>WASD · caminar | mouse · mirar<br>Clic · tocar | 1–8 · notas<br>Quest: joysticks y gatillos<br><span id="status">Explora el escenario</span></div>
<a-scene background="color:#080b18" fog="type: exponential; color:#101323; density:0.006" renderer="antialias:true; colorManagement:true" vr-mode-ui="enabled:true">
<a-entity light="type:ambient; color:#b6c5ff; intensity:0.65"></a-entity><a-entity light="type:directional; intensity:1.2; color:#dbe6ff" position="-10 25 15"></a-entity>
<a-entity id="world"></a-entity><a-entity id="rig" position="0 0 23" walk><a-camera id="cam" position="0 1.7 0" wasd-controls="enabled:false" look-controls="pointerLockEnabled:true"><a-cursor raycaster="objects:.hit; far:35" fuse="false" material="color:#fff; shader:flat" scale="0.65 0.65 0.65"></a-cursor></a-camera><a-entity id="left" laser-controls="hand:left" raycaster="objects:.hit; far:35"></a-entity><a-entity id="right" laser-controls="hand:right" raycaster="objects:.hit; far:35"></a-entity></a-entity>
</a-scene><script>
const scene=document.querySelector('a-scene'),world=document.querySelector('#world');
function el(tag,attrs={},parent=world){let e=document.createElement(tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}
function box(x,y,z,w,h,d,c,p=world,extra={}){return el('a-box',{position:`${x} ${y} ${z}`,width:w,height:h,depth:d,color:c,...extra},p)}
function cyl(x,y,z,r,h,c,p=world,extra={}){return el('a-cylinder',{position:`${x} ${y} ${z}`,radius:r,height:h,color:c,'segments-radial':24,...extra},p)}
function group(x,y,z){return el('a-entity',{position:`${x} ${y} ${z}`})}
function label(p,name,x,y,z,w=4){el('a-text',{value:name,align:'center',color:'#fff',width:w,position:`${x} ${y} ${z}`},p)}
function hit(e,name,n=0){e.setAttribute('playable',{name,n});return e}
const dark='#171922',steel='#77808e',gold='#c5a45d',white='#f4f1e9';
box(0,-.16,0,145,.3,145,'#20372e');for(let i=-40;i<40;i+=8)box(i,-.005,0,4,.01,85,'#263e32');
// Graderías escalonadas, sectores y accesos.
for(let tier=0;tier<2;tier++)for(let row=0;row<7;row++){let r=46+tier*13+row*1.65,y=.7+tier*8+row*.8;el('a-ring',{radiusInner:r-.83,radiusOuter:r+.83,rotation:'-90 0 0',position:`0 ${y} 0`,color:'#535866','segments-theta':96});for(let s=0;s<48;s++){if(s%12===0)continue;let a=s*Math.PI/24;let e=box(Math.cos(a)*r,y+.25,Math.sin(a)*r,3.6,.48,.72,tier?'#343f63':'#294d76');e.setAttribute('rotation',`0 ${90-a*180/Math.PI} 0`);}}
for(let s=0;s<32;s++){let a=s*Math.PI/16;box(Math.cos(a)*70,8,Math.sin(a)*70,.6,16,.6,steel);let e=box(Math.cos(a)*65,16,Math.sin(a)*65,13,.45,4,dark);e.setAttribute('rotation',`0 ${-a*180/Math.PI} 0`)}
// Escenario y pasarela.
box(0,.6,-18,36,1.2,18,dark);box(0,.6,2,6,1.2,22,dark);cyl(0,.6,14,5,1.2,dark);for(let x of [-3,3])box(x,1.23,2,.09,.06,22,'#ae8cff',world,{material:'shader:flat'});box(0,1.23,-9,36,.05,.09,'#ae8cff',world,{material:'shader:flat'});
for(let i=0;i<6;i++)box(16,.1*(i+1),-5-i*.65,3,.2*(i+1),.65,dark);
for(let x of [-18,18])for(let z of [-27,-9]){box(x,8,z,.5,16,.5,steel);for(let i=1;i<16;i++){let b=box(x,i,z,.1,1.3,.12,steel);b.setAttribute('rotation',`0 0 ${i%2?35:-35}`)}}for(let z of [-27,-9])box(0,16,z,36,.5,.5,steel);for(let x of [-18,18])box(x,16,-18,.5,.5,18,steel);
box(0,8,-26.8,28,12,.5,'#090a10');box(0,8,-26.48,27.5,11.5,.1,'#5145a5',world,{id:'screen',material:'shader:flat'});for(let i=0;i<36;i++){let b=box(-13+i*.74,8,-26.35,.42,3,.08,colors[i%4],world,{material:'shader:flat'});b.setAttribute('animation',`property:scale.y;from:.2;to:${1+Math.sin(i)*.7};dur:${650+i%7*110};dir:alternate;loop:true;easing:easeInOutSine`)}
for(let x of [-20,20]){box(x,7,-24,5,9,.4,'#28243f');for(let i=0;i<7;i++){box(x,3+i,-13,1.8,.9,1.2,'#08090b');cyl(x,3+i,-12.35,.32,.08,'#333844',world,{rotation:'90 0 0'})}}
// Piano.
let p=group(-10,1.2,-18);box(0,1.15,-.6,2.8,.35,2.6,'#08090c',p);cyl(0,1.15,-1.65,1.4,.35,'#08090c',p);box(0,1.65,-.8,2.8,.12,2.7,'#14151a',p,{rotation:'0 0 18'});for(let x of [-1.1,1.1])box(x,.55,.45,.13,1.1,.13,dark,p);box(0,.55,-2,.13,1.1,.13,dark,p);for(let i=0;i<24;i++){hit(box(-1.32+i*.113,1.37,.82,.108,.08,.55,white,p),'Piano',i%8);if(![2,6].includes(i%7))hit(box(-1.27+i*.113,1.44,.68,.065,.09,.3,'#08090b',p),'Piano',i%8)}box(0,.55,1.8,1.2,.18,.6,dark,p);for(let x of [-.45,.45])box(x,.25,1.8,.12,.5,.4,steel,p);label(p,'PIANO',0,2.8,1);
// Batería.
let d=group(0,1.2,-21);box(0,.15,0,5,.3,4,dark,d);function drum(x,y,z,r,h,rot,n){let g=el('a-entity',{position:`${x} ${y} ${z}`,rotation:rot},d);hit(cyl(0,0,0,r,h,'#8d2945',g),'Batería',n);hit(cyl(0,h/2+.02,0,r+.025,.05,white,g),'Batería',n);cyl(0,-h/2,0,r+.025,.05,steel,g)}drum(0,1,1,.75,.7,'90 0 0',0);drum(-.6,1.85,.6,.4,.45,'0 0 0',1);drum(.6,1.85,.6,.4,.45,'0 0 0',2);drum(1.5,1,0,.55,.7,'0 0 0',3);drum(-1.4,1.2,.5,.42,.25,'0 0 0',4);for(let x of [-2,2])for(let z of [-.6,1.3]){cyl(x,1.25,z,.035,2,steel,d);hit(cyl(x,2.3,z,.65,.055,gold,d),'Batería',5)}label(d,'BATERÍA',0,3.2,1);
// Guitarra y bajo.
function guitar(name,x,z,c){let g=group(x,1.2,z);hit(el('a-sphere',{position:'0 .8 0',scale:'.55 .72 .14',color:c},g),name);hit(el('a-sphere',{position:'0 1.3 0',scale:'.43 .43 .14',color:c},g),name);hit(box(0,1.95,0,.19,1.45,.12,'#69472f',g),name);box(0,2.78,0,.32,.36,.13,c,g);for(let i=0;i<(name==='Bajo'?4:6);i++)box(-.065+i*.025,1.68,.16,.008,2.05,.008,steel,g);for(let i=0;i<13;i++)box(0,1.35+i*.09,.075,.2,.013,.02,steel,g);box(0,.65,-.2,.7,.12,.6,dark,g);box(1.1,.6,-.3,1.1,1.2,.7,dark,g);box(1.1,.6,.065,.95,.95,.04,'#41434a',g);label(g,name,0,3.3,.3)}guitar('Guitarra',7,-19,'#b52b39');guitar('Bajo',12,-20,'#ba8a51');
let k=group(-11,1.2,-12);box(0,1.05,0,3,.2,.85,dark,k);for(let i=0;i<24;i++)hit(box(-1.38+i*.118,1.19,.15,.11,.06,.5,white,k),'Sintetizador',i%8);for(let i=0;i<24;i++)if(![2,6].includes(i%7))hit(box(-1.32+i*.118,1.24,.02,.065,.07,.28,dark,k),'Sintetizador',i%8);for(let a of [-30,30])box(0,.52,0,.12,1.2,.15,steel,k,{rotation:`0 0 ${a}`});label(k,'SINTETIZADOR',0,2,.5);
let dj=group(10,1.2,-12);box(0,.55,0,3.2,1.1,1.2,dark,dj);for(let x of [-1,1])hit(cyl(x,1.17,0,.47,.1,steel,dj),'DJ');for(let i=0;i<8;i++)hit(box(-.3+i%4*.2,1.16,-.2+Math.floor(i/4)*.3,.12,.08,.12,colors[i%4],dj),'DJ',i);label(dj,'DJ',0,2,.5);
cyl(0,1.25,-10,.35,.1,dark);cyl(0,2.05,-10,.035,1.6,steel);cyl(0,2.9,-10,.07,.3,dark,world,{rotation:'0 0 65'});
// Focos y haces visuales.
for(let i=0;i<8;i++){let x=-15+i*4.3;box(x,15.4,-10,.7,.6,.7,dark);el('a-entity',{class:'showlight',position:`${x} 15 -10`,light:`type:spot; color:${colors[i%4]}; intensity:2.5; angle:27; penumbra:.6; distance:38; target:#target${i}`});el('a-entity',{id:`target${i}`,position:`${x*.6} 1 -18`});el('a-cone',{class:'beam',position:`${x} 8 -13`,rotation:'20 0 0',height:14,'radius-bottom':2.5,'radius-top':.03,material:`shader:flat; color:${colors[i%4]}; transparent:true; opacity:.045; depthWrite:false; side:double`})}
let mist=el('a-entity',{id:'mist',visible:false});for(let i=0;i<12;i++)el('a-sphere',{position:`${-14+i*2.5} 1.6 -14`,scale:'3 .25 1.6',material:'shader:flat; color:#a9b3ce; transparent:true; opacity:.06; depthWrite:false'},mist);
// Panel físico accesible con los mandos VR.
let panel=group(-5,1.2,-10);box(0,1.3,0,2.7,1.5,.15,dark,panel);label(panel,'CONTROL',0,1.86,.1,3);['lights','screen','fog'].forEach((a,i)=>{let y=1.5-i*.36;box(0,y,.12,2.35,.28,.12,'#43456c',panel,{action:a});label(panel,['LUCES','PANTALLA','HUMO'][i],0,y,.2,2.5)});
window.addEventListener('keydown',e=>{let n=Number(e.key);if(n>=1&&n<=8&&!e.repeat)note(active,n-1)});scene.addEventListener('enter-vr',()=>document.body.classList.add('vr'));scene.addEventListener('exit-vr',()=>document.body.classList.remove('vr'));
</script></body></html>
